name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The canonical archive builder (the same image as release.yml): gzip bytes depend on the zlib
    # implementation, so every build that can become a release uses this one (see RELEASING.md).
    container:
      image: docker.io/library/fedora:44@sha256:b189269dfee735c54ebcd3b4e43ff2dc0d4a4b07855468970217c9df57968eb0
    strategy:
      matrix:
        node: ['22.23.2', '24.15.0']
    steps:
      - name: Install the canonical archive toolchain
        run: |
          set -Eeuo pipefail
          dnf -y -q --setopt=install_weak_deps=False install python3 python-unversioned-command git-core tar gzip findutils
          test "$(rpm -q zlib-ng-compat)" = zlib-ng-compat-2.3.3-3.fc44.x86_64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build and verify archive reproduction
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run release:archive
          sha256sum .cache/official.geocoder-*.tgz > "$RUNNER_TEMP/plugin.sha256"
          npm run release:archive
          sha256sum --check "$RUNNER_TEMP/plugin.sha256"
      - name: Load packaged code without repository dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/plugin-isolation"
          tar -xzf .cache/official.geocoder-*.tgz -C "$RUNNER_TEMP/plugin-isolation"
          cd "$RUNNER_TEMP/plugin-isolation"
          node - <<'JS'
          const assert = require('node:assert/strict');
          const { timezoneForPoint } = require('./package/dist/timezone');
          assert.equal(timezoneForPoint({latitude: 38.7223, longitude: -9.1393}).timezone, 'Europe/Lisbon');
          assert.equal(timezoneForPoint({latitude: 37.7412, longitude: -25.6756}).timezone, 'Atlantic/Azores');
          JS
      - name: Retain exact validated archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geocoder-node-${{ matrix.node }}
          path: .cache/official.geocoder-*.tgz
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
